# Placeholder build: plain docker commands, no third-party actions except checkout.
# TODO before first run: pin actions/checkout to a full commit SHA; add SBOM generation and image signing;
# generate the notices from the SBOM before the build.
name: build-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare licences for the image
        run: cp LICENSE THIRD-PARTY-NOTICES.md nodality/
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build nodality \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --tag ghcr.io/nodality-casa/nodality:"$VERSION" --push
